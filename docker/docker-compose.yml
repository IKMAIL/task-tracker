version: "3.9"

services:
  identity-service:
    build:
      context: ../
      dockerfile: services/identity-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: ${IDENTITY_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      ADMIN_GROUP_ID: ${ADMIN_GROUP_ID}

  task-service:
    build:
      context: ../
      dockerfile: services/task-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URI: ${TASK_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  progress-service:
    build:
      context: ../
      dockerfile: services/progress-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MONGO_URI: ${PROGRESS_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      TASK_SERVICE_URL: http://task-service:3002

  alert-service:
    build:
      context: ../
      dockerfile: services/alert-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      MONGO_URI: ${ALERTS_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      TASK_SERVICE_URL: http://task-service:3002
      PROGRESS_SERVICE_URL: http://progress-service:3003

  team-service:
    build:
      context: ../
      dockerfile: services/team-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      MONGO_URI: ${TEAM_MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}

  api-gateway:
    build:
      context: ../
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_SERVICE_URL: http://identity-service:3001
      TASK_SERVICE_URL: http://task-service:3002
      PROGRESS_SERVICE_URL: http://progress-service:3003
      ALERT_SERVICE_URL: http://alert-service:3004
      TEAM_SERVICE_URL: http://team-service:3006

  web-frontend:
    build:
      context: ../apps/web-frontend
      args:
        REACT_APP_API_URL: http://localhost:3000/api
    restart: unless-stopped
    ports:
      - "3005:3005"

volumes:
  mongo_data:
