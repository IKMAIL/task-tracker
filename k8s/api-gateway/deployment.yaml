apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: task-tracker
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: localhost:5000/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: JWT_SECRET
            - name: IDENTITY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: IDENTITY_SERVICE_URL
            - name: TASK_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: TASK_SERVICE_URL
            - name: PROGRESS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: PROGRESS_SERVICE_URL
            - name: ALERT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: ALERT_SERVICE_URL
            - name: TEAM_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: TEAM_SERVICE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
