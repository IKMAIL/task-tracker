apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: task-tracker
  labels:
    app: identity-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          # CI/CD pipeline replaces :latest with the immutable image tag (e.g. git SHA)
          image: localhost:5000/identity-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_URI
              value: "mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@mongo-headless.task-tracker.svc.cluster.local:27017/identity?authSource=admin"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: JWT_EXPIRES_IN
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: SERVICE_TOKEN
            - name: MICROSOFT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: MICROSOFT_CLIENT_ID
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: MICROSOFT_CLIENT_SECRET
            - name: MICROSOFT_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: MICROSOFT_TENANT_ID
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
