apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-service
  namespace: task-tracker
  labels:
    app: progress-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: progress-service
  template:
    metadata:
      labels:
        app: progress-service
    spec:
      containers:
        - name: progress-service
          image: your-registry/task-tracker/progress-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_URI
              value: "mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@mongo-headless.task-tracker.svc.cluster.local:27017/progress?authSource=admin"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: JWT_SECRET
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: SERVICE_TOKEN
            - name: TASK_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: TASK_SERVICE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 20
