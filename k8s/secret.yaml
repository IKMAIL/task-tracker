# IMPORTANT: This file contains placeholder (non-sensitive) base64 values.
# DO NOT commit real secrets here.
# In CI/CD, create this secret via:
#   kubectl create secret generic task-tracker-secret \
#     --from-literal=JWT_SECRET=<real-value> \
#     --from-literal=SERVICE_TOKEN=<real-value> \
#     --from-literal=MONGO_ROOT_USERNAME=<real-value> \
#     --from-literal=MONGO_ROOT_PASSWORD=<real-value> \
#     --from-literal=MICROSOFT_CLIENT_ID=<real-value> \
#     --from-literal=MICROSOFT_CLIENT_SECRET=<real-value> \
#     --from-literal=MICROSOFT_TENANT_ID=<real-value> \
#     -n task-tracker
# Or use a secrets manager (AWS Secrets Manager, HashiCorp Vault, Sealed Secrets, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: task-tracker-secret
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-tracker
type: Opaque
stringData:
  JWT_SECRET: "change-me-to-a-long-random-secret"
  SERVICE_TOKEN: "change-me-to-another-long-random-secret"
  MONGO_ROOT_USERNAME: "root"
  MONGO_ROOT_PASSWORD: "rootpassword"
  MICROSOFT_CLIENT_ID: "your-azure-app-client-id"
  MICROSOFT_CLIENT_SECRET: "your-azure-app-client-secret"
  MICROSOFT_TENANT_ID: "your-azure-directory-tenant-id"
