# IMPORTANT: This file is a TEMPLATE. Do NOT commit real secret values.
# For production, use Sealed Secrets, HashiCorp Vault, or your cloud provider's KMS.
#
# To encode a value:  echo -n 'your-value' | base64
# To decode a value:  echo 'encoded-value' | base64 -d
#
# Apply with: kubectl apply -f k8s/secrets.yaml
# (after replacing all REPLACE_WITH_BASE64_* placeholders below)
apiVersion: v1
kind: Secret
metadata:
  name: task-tracker-secret
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: task-tracker
type: Opaque
data:
  # MongoDB credentials — must match MONGO_INITDB_ROOT_USERNAME/PASSWORD in the StatefulSet
  MONGO_ROOT_USERNAME: REPLACE_WITH_BASE64_ENCODED_USERNAME
  MONGO_ROOT_PASSWORD: REPLACE_WITH_BASE64_ENCODED_PASSWORD

  # JWT signing secret — use a long, random string (min 32 chars recommended)
  JWT_SECRET: REPLACE_WITH_BASE64_ENCODED_JWT_SECRET

  # Inter-service authentication token — shared among all backend services
  SERVICE_TOKEN: REPLACE_WITH_BASE64_ENCODED_SERVICE_TOKEN

  # Microsoft Azure SSO — from your Azure App Registration
  MICROSOFT_CLIENT_ID: REPLACE_WITH_BASE64_ENCODED_CLIENT_ID
  MICROSOFT_CLIENT_SECRET: REPLACE_WITH_BASE64_ENCODED_CLIENT_SECRET
  MICROSOFT_TENANT_ID: REPLACE_WITH_BASE64_ENCODED_TENANT_ID

  # Azure AD group object ID whose members receive the admin role
  ADMIN_GROUP_ID: REPLACE_WITH_BASE64_ENCODED_ADMIN_GROUP_ID
