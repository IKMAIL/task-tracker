apiVersion: v1
kind: Service
metadata:
  name: web-frontend
  namespace: task-tracker
  labels:
    app: web-frontend
spec:
  # ClusterIP (default) — external access is handled by the Ingress controller.
  # NodePort was removed to avoid a second, uncontrolled entry point on the cluster nodes.
  selector:
    app: web-frontend
  ports:
    - name: http
      port: 3005
      targetPort: 3005
